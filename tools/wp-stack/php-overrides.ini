; PHP overrides for the dev stack (mounted into /usr/local/etc/php/conf.d/).
; The wordpress:php8.2-apache image ships compiled defaults
; (max_execution_time=30, post_max_size=8M, upload_max_filesize=2M,
; memory_limit=128M) which are too tight for the single-request
; validate+backup+save+diff write pipeline on large converted trees and for
; base64 media uploads. Production sites need equivalent ini headroom.
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 512M
