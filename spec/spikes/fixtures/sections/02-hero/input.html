<!--
  WP-S03 fixture 02 — Hero section (two-column, gradient + media).
  Representative landing-page hero: eyebrow, big headline, subhead,
  dual CTA buttons, trust line, and a media column with a framed image
  plus an absolutely-positioned floating "stat" chip. Exercises gradient
  background, backdrop-filter glass chip, text gradient (clip), transform,
  transition, and absolute positioning.
-->
<section class="hero">
  <div class="hero__inner">
    <div class="hero__copy">
      <p class="hero__eyebrow">New · v4 is here</p>
      <h1 class="hero__title">Ship marketing pages <span class="hero__accent">in minutes</span></h1>
      <p class="hero__lead">
        Turn any HTML section into native, editable building blocks. Fast, accessible, and on-brand by default.
      </p>
      <div class="hero__actions">
        <a class="btn btn--solid" href="/start">Start free</a>
        <a class="btn btn--ghost" href="/demo">Watch demo</a>
      </div>
      <p class="hero__trust">Trusted by 12,000+ teams worldwide</p>
    </div>

    <div class="hero__media">
      <img class="hero__img" src="https://picsum.photos/seed/herocard/720/520" alt="Product dashboard preview" />
      <div class="hero__chip">
        <span class="hero__chip-num">98%</span>
        <span class="hero__chip-label">faster builds</span>
      </div>
    </div>
  </div>
</section>
