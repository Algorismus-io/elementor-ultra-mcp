openapi: 3.1.0
info:
  title: Elementor ULTRA MCP — Companion Plugin REST API
  description: >
    FROZEN contract for the elementor-ultra/v1 REST surface exposed by the
    companion WordPress plugin (plugin/elementor-ultra-mcp). Normative source of
    truth is spec/contracts/10-rest-api.md; this file is the machine-readable
    companion. Where they disagree, the Markdown wins. Auth is WordPress
    Application Passwords (HTTP Basic). Every 2xx response is wrapped in
    {success:true,data:<payload>}; every error is {code,message,data:{status,...}}.
  version: 1.0.0
servers:
  - url: "{wpUrl}/wp-json/elementor-ultra/v1"
    variables:
      wpUrl:
        default: https://example.test
        description: WordPress site base URL
security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: base64("<wp_user>:<application_password>")

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, nullable: true }
    Fields:
      name: fields
      in: query
      required: false
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    PostId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: WordPress post id (0 = validate a new, not-yet-persisted tree)

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          description: Stable taxonomy code (WP-F05).
        message: { type: string }
        data:
          type: object
          required: [status]
          properties:
            status: { type: integer }
            op_id: { type: string, nullable: true }
            errors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
            meta: { type: object, additionalProperties: true }
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, description: "Dotted JSON-pointer-like path into the request body" }
        code: { type: string }
        message: { type: string }
        meta: { type: object, additionalProperties: true }
    Pagination:
      type: object
      required: [items, next_cursor, total]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }
    OpId:
      type: string
      pattern: '^[A-Za-z0-9_.-]{1,64}$'
    BaseHash:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: md5 of _elementor_data (optimistic-concurrency token)
    ElementNode:
      type: object
      description: >
        Authoring-contract node (V4 atomic or V3 classic). Full schema lives in
        spec/contracts/20-authoring-json.md (WP-F03). Loosely typed here.
      additionalProperties: true
      required: [id, elType]
      properties:
        id: { type: string }
        elType: { type: string }
        widgetType: { type: string }
        settings: { type: object, additionalProperties: true }
        elements: { type: array, items: { type: object } }
    Diff:
      type: object
      properties:
        changed_ids: { type: array, items: { type: string } }
        new_ids: { type: array, items: { type: string } }
        removed_ids: { type: array, items: { type: string } }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
    ConditionTuple:
      type: array
      minItems: 2
      maxItems: 4
      items: { type: string }
      description: "[type, name, sub_name?, sub_id?]; type in {include,exclude}"
    GlobalClassesChanges:
      type: object
      required: [added, deleted, modified]
      additionalProperties: false
      properties:
        added: { type: array, items: { type: string } }
        deleted: { type: array, items: { type: string } }
        modified: { type: array, items: { type: string } }
        order: { type: boolean }

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    BadRequest:
      description: Malformed request / missing param (E_BAD_REQUEST, E_MISSING_PARAM)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing/invalid Application Password (rest_not_logged_in)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Lacks capability (E_FORBIDDEN_CAP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found (E_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Optimistic-lock / autosave / post-lock conflict (E_BASE_HASH_MISMATCH, E_AUTOSAVE_CONFLICT, E_POST_LOCKED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: Semantic validation failure (E_ATOMIC_VALIDATION, E_ID_COLLISION, E_BUDGET_EXCEEDED, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FeatureUnavailable:
      description: Route present but feature gated off (E_FEATURE_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths:
  /site/capabilities:
    get:
      summary: Probe experiments/Pro/types/breakpoints/caps/migrations/health
      operationId: getSiteCapabilities
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /documents:
    get:
      summary: List Elementor documents (paginated)
      operationId: listDocuments
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [any, publish, draft, trash, pending, private], default: any } }
        - { name: post_type, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Create a blank Elementor document
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, default: "New Page" }
                post_type: { type: string, default: page }
                template_type: { type: string }
                status: { type: string, enum: [draft, publish, pending, private], default: draft }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /documents/{id}:
    get:
      summary: Get element tree + base_hash
      operationId: getDocument
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { name: depth, in: query, required: false, schema: { type: integer } }
        - { name: subtree_id, in: query, required: false, schema: { type: string } }
        - { name: projection, in: query, required: false, schema: { type: string, enum: [full, summary], default: full } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Trash (or force-delete) a document
      operationId: deleteDocument
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { name: force, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/settings:
    get:
      summary: Get document/page settings
      operationId: getDocumentSettings
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Patch document/page settings (GET-merge-PUT, WP-S04)
      operationId: updateDocumentSettings
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
                base_hash: { $ref: '#/components/schemas/BaseHash' }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /documents/{id}/dry-run:
    post:
      summary: AUTHORITATIVE validate + diff, NO persist
      operationId: dryRunDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elements]
              properties:
                elements: { type: array, items: { $ref: '#/components/schemas/ElementNode' } }
                settings: { type: object, additionalProperties: true }
                generation: { type: string, enum: [v4, v3] }
                want_preview: { type: boolean, default: false }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /documents/{id}/save:
    post:
      summary: Persist elements and/or settings (validated, optionally primed)
      operationId: saveDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                elements: { type: array, items: { $ref: '#/components/schemas/ElementNode' } }
                settings: { type: object, additionalProperties: true }
                base_hash: { $ref: '#/components/schemas/BaseHash' }
                op_id: { $ref: '#/components/schemas/OpId' }
                prime_css: { type: boolean, default: false }
                force: { type: boolean, default: false }
                backup: { type: boolean, default: true }
                verify_render: { type: boolean, default: false, description: 'Contract 18 §7-AI S2 — run the post-save+prime render-verification probe; the response gains render_verified + render_probe.' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /documents/{id}/replace-tree:
    post:
      summary: Overwrite whole element tree (txn, base_hash required)
      operationId: replaceTree
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elements, base_hash]
              properties:
                elements: { type: array, items: { $ref: '#/components/schemas/ElementNode' } }
                settings: { type: object, additionalProperties: true }
                base_hash: { $ref: '#/components/schemas/BaseHash' }
                op_id: { $ref: '#/components/schemas/OpId' }
                prime_css: { type: boolean, default: false }
                force: { type: boolean, default: false }
                backup: { type: boolean, default: true }
                verify_render: { type: boolean, default: false, description: 'Contract 18 §7-AI S2 — run the post-save+prime render-verification probe; the response gains render_verified + render_probe.' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /documents/{id}/elements:
    post:
      summary: Granular element-op batch (insert/update/move/delete/classes/style/dynamic/global)
      operationId: elementOps
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_hash, ops]
              properties:
                base_hash: { $ref: '#/components/schemas/BaseHash' }
                ops:
                  type: array
                  items:
                    type: object
                    required: [op]
                    properties:
                      op: { type: string, enum: [insert, update_settings, move, delete, set_classes, set_local_style, bind_dynamic, bind_global] }
                    additionalProperties: true
                force: { type: boolean, default: false }
                prime_css: { type: boolean, default: false }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /documents/{id}/prime-css:
    post:
      summary: Prime V4 atomic CSS (WP-S01)
      operationId: primeCss
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approach: { type: string, enum: [loopback, programmatic, auto], default: auto }
                breakpoints: { type: array, items: { type: string } }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/backup:
    post:
      summary: Revision-independent snapshot
      operationId: backupDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/backups:
    get:
      summary: List snapshots (paginated)
      operationId: listBackups
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/rollback:
    post:
      summary: Restore a snapshot
      operationId: rollbackDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta_key]
              properties:
                meta_key: { type: string }
                prime_css: { type: boolean, default: true }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/verify-render:
    post:
      summary: Verify the document RENDERS (contract 18 §7-AI S2 — permalink loopback probe with mandatory in-process front-controller dispatch fallback; asserts no fatal marker; op-logged)
      operationId: verifyRenderDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/duplicate:
    post:
      summary: Deep-copy document + meta with fresh ids
      operationId: duplicateDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                status: { type: string, enum: [draft, publish, pending, private], default: draft }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/export:
    post:
      summary: Emit library-format JSON (with referenced classes/variables)
      operationId: exportDocument
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/lock-status:
    get:
      summary: Lock + newer-autosave status
      operationId: lockStatus
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/ids:
    get:
      summary: Used-id set for a document
      operationId: documentIds
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schema/widget/{type}:
    get:
      summary: Per-widget schema (post-filter get_props_schema, incl _cssid)
      operationId: schemaWidget
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schema/styles:
    get:
      summary: Atomic Style_Schema + units + enums
      operationId: schemaStyles
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /schema/registered-types:
    get:
      summary: Registered elTypes/widgetTypes on this site
      operationId: schemaRegisteredTypes
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /schema/breakpoints:
    get:
      summary: Active breakpoints
      operationId: schemaBreakpoints
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /design/classes:
    get:
      summary: List global classes (paginated) + order
      operationId: listGlobalClasses
      parameters:
        - { name: context, in: query, required: false, schema: { type: string, enum: [frontend, preview], default: frontend } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      summary: Diff-PUT upsert/delete/reorder global classes
      operationId: putGlobalClasses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, items, order]
              properties:
                context: { type: string, enum: [frontend, preview], default: frontend }
                changes: { $ref: '#/components/schemas/GlobalClassesChanges' }
                items: { type: object, additionalProperties: { type: object } }
                order: { type: array, items: { type: string } }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /design/classes/usage:
    get:
      summary: Where global classes are used
      operationId: globalClassesUsage
      parameters:
        - { name: context, in: query, required: false, schema: { type: string, enum: [frontend, preview], default: frontend } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /design/variables:
    get:
      summary: List variables + watermark
      operationId: listVariables
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a variable
      operationId: createVariable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, label, value]
              properties:
                type: { type: string, enum: [global-color-variable, global-font-variable, global-size-variable] }
                label: { type: string, maxLength: 50 }
                value: { type: string, maxLength: 512 }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /design/variables/{id}:
    put:
      summary: Update a variable
      operationId: updateVariable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, value]
              properties:
                label: { type: string, maxLength: 50 }
                value: { type: string, maxLength: 512 }
                order: { type: integer, minimum: 0 }
                type: { type: string }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      summary: Delete (soft) a variable
      operationId: deleteVariable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /design/variables/{id}/restore:
    post:
      summary: Restore a deleted variable
      operationId: restoreVariable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                value: { type: string }
                type: { type: string }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /design/variables/batch:
    post:
      summary: Atomic multi-op (watermark)
      operationId: batchVariables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watermark, operations]
              properties:
                watermark: { type: integer, minimum: 0 }
                operations:
                  type: array
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [create, update, delete, restore, reorder] }
                    additionalProperties: true
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /design/global-colors:
    get:
      summary: V3 kit colors
      operationId: getGlobalColors
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      summary: Set V3 kit colors
      operationId: putGlobalColors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system_colors: { type: array, items: { type: object } }
                custom_colors: { type: array, items: { type: object } }
                op_id: { $ref: '#/components/schemas/OpId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /design/global-fonts:
    get:
      summary: V3 kit typography
      operationId: getGlobalFonts
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      summary: Set V3 kit typography
      operationId: putGlobalFonts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system_typography: { type: array, items: { type: object } }
